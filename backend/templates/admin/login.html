<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — OpenDonasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Open Sans', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <h1 class="font-heading text-3xl font-extrabold text-gray-900">
        Open<span class="text-cyan-500">Donasi</span>
      </h1>
      <p class="text-gray-500 mt-2 text-sm">Panel Administrasi</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h2 class="font-heading text-xl font-bold text-gray-900 mb-1">Masuk Admin</h2>
      <p class="text-gray-400 text-sm mb-6">Gunakan kredensial admin untuk melanjutkan.</p>

      {{if .Error}}
      <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
        <p class="text-red-600 text-sm">⚠️ {{.Error}}</p>
      </div>
      {{end}}

      <form method="POST" action="/admin/login">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
          <input
            type="email"
            name="email"
            placeholder="admin@opendonasi.com"
            required
            class="w-full px-4 py-3 border border-gray-200 rounded-lg bg-gray-50 text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 transition"
          />
        </div>

        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
          <input
            type="password"
            name="password"
            placeholder="••••••••"
            required
            class="w-full px-4 py-3 border border-gray-200 rounded-lg bg-gray-50 text-sm focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full py-3 bg-cyan-500 hover:bg-cyan-600 text-white font-semibold rounded-lg transition shadow-md hover:shadow-lg"
        >
          Masuk
        </button>
      </form>
    </div>

    <p class="text-center text-gray-400 text-xs mt-6">&copy; 2026 OpenDonasi Admin Panel</p>
  </div>
</body>
</html>
